name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Gradle indir
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Release APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee ../derleme.log

      - name: Derleme hatalarını göster
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|> " derleme.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk NeonVideoBot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeonVideoBot-apk
          path: NeonVideoBot.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Neon Video Bot v1.0.${{ github.run_number }}
          body: |
            📱 Telefona kurmak için aşağıdaki **NeonVideoBot.apk** dosyasını indir ve aç.
            (İlk kurulumda "bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.)
          files: NeonVideoBot.apk
          make_latest: true
