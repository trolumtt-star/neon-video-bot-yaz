name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Release APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk NeonVideoBot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeonVideoBot-apk
          path: NeonVideoBot.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Neon Video Bot v1.0.${{ github.run_number }}
          body: |
            📱 Telefona kurmak için aşağıdaki **NeonVideoBot.apk** dosyasını indir ve aç.
            (İlk kurulumda "bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.)
          files: NeonVideoBot.apk
          make_latest: true
